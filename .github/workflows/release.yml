# Publishes a release when a push to main carries a version in `Cargo.toml` that no tag
# names yet; a push that leaves the version alone builds nothing. Each archive is named
# by its target alone, so `releases/latest/download/splice-<target>.tar.gz` always
# resolves to the newest build, which is the URL `install.sh` reads.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
      unreleased: ${{ steps.read.outputs.unreleased }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "unreleased=false" >> "$GITHUB_OUTPUT"
          else
            echo "unreleased=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.unreleased == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the musl linker
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Add the target
        run: rustup target add ${{ matrix.target }}
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        run: |
          staging="splice-${{ matrix.target }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/splice" LICENSE README.md "$staging/"
          tar --create --gzip --file "$staging.tar.gz" "$staging"
          shasum --algorithm 256 "$staging.tar.gz" > "$staging.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: splice-${{ matrix.target }}
          path: splice-${{ matrix.target }}.tar.gz*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.version.outputs.version }}" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v${{ needs.version.outputs.version }}" \
            --generate-notes
